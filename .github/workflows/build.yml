name: Build Ergohaven RMK Firmware

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan firmware coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.policy.outputs.run }}
      reason: ${{ steps.policy.outputs.reason }}
      source_run: ${{ steps.policy.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s .github/scripts -p test_ci_policy.py
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_workflow_*.py'
      - id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_policy.py plan --profile firmware

  validate-profile:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    name: Validate Ergohaven firmware profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep jq

      - name: Validate profile contract
        run: |
          ./scripts/check_ergohaven_profile.sh
          python3 scripts/test_ergohaven_unlock_keys.py

      - name: Install Rust for K:04 migration test
        uses: dtolnay/rust-toolchain@stable

      - name: Test K:04 persisted timeout migration
        run: python3 scripts/test_k04_timeout_migration.py

      - name: Test K:04 host connection parameter negotiation
        run: python3 scripts/test_k04_host_params.py

  build:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    name: Build ${{ matrix.output_name }} firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: k03
            output_name: k03
            keyboard_toml: keyboard.toml
            vial_json: vial.json
            build_features: "--features universal_mac_iso"
          - keyboard: k04
            output_name: k04_series_k04
            keyboard_toml: keyboard.toml
            vial_json: vial.json
            build_features: "--features production_v30g,universal_mac_iso"
          - keyboard: k04
            output_name: k04_series_mini
            keyboard_toml: keyboard_mini.toml
            vial_json: vial_mini.json
            build_features: "--features production_v30g"
          - keyboard: k04
            output_name: k04_series_micro
            keyboard_toml: keyboard_micro.toml
            vial_json: vial_micro.json
            build_features: "--features production_v30g,universal_mac_iso"
          - keyboard: imperial44
            output_name: imperial44
            keyboard_toml: keyboard.toml
            vial_json: vial.json
            build_features: "--features universal_mac_iso"
          - keyboard: op36
            output_name: op36
            keyboard_toml: keyboard.toml
            vial_json: vial.json
            build_features: "--features universal_mac_iso"
          - keyboard: velvet
            output_name: velvet
            keyboard_toml: keyboard.toml
            vial_json: vial.json
            build_features: "--features universal_mac_iso"
            central_output_name: velvet_standalone_right_main.uf2
            peripheral_output_name: velvet_standalone_left_peripheral.uf2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi clang libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.output_name }}-${{ hashFiles(format('keyboards/{0}/Cargo.lock', matrix.keyboard)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.keyboard }}-
            ${{ runner.os }}-cargo-

      - name: Install flip-link
        run: cargo install flip-link --locked

      - name: Download uf2conv script
        run: |
          for i in 1 2 3 4 5; do
            curl -fL --retry 3 --retry-delay 5 \
              https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py \
              -o uf2conv.py && break || sleep 10
          done
          for i in 1 2 3; do
            curl -fL --retry 3 --retry-delay 5 \
              https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json \
              -o uf2families.json && break || sleep 10
          done
          python3 -c "import ast; ast.parse(open('uf2conv.py').read())" || { echo "uf2conv.py invalid"; exit 1; }
          chmod +x uf2conv.py

      - name: Build Central
        working-directory: keyboards/${{ matrix.keyboard }}
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/lib/arm-none-eabi --target=arm-none-eabi -I/usr/lib/arm-none-eabi/include -I/usr/lib/gcc/arm-none-eabi/13.2.1/include"
          KEYBOARD_TOML_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.keyboard_toml }}
          RUST_MIN_STACK: "33554432"
          VIAL_JSON_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.vial_json }}
        run: cargo build --release --bin central ${{ matrix.build_features }}

      - name: Build Peripheral
        working-directory: keyboards/${{ matrix.keyboard }}
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/lib/arm-none-eabi --target=arm-none-eabi -I/usr/lib/arm-none-eabi/include -I/usr/lib/gcc/arm-none-eabi/13.2.1/include"
          KEYBOARD_TOML_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.keyboard_toml }}
          RUST_MIN_STACK: "33554432"
          VIAL_JSON_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.vial_json }}
        run: cargo build --release --bin peripheral ${{ matrix.build_features }}

      - name: Convert to UF2
        working-directory: keyboards/${{ matrix.keyboard }}
        run: |
          arm-none-eabi-objcopy -O binary \
            target/thumbv7em-none-eabihf/release/central left.bin
          python3 ../../uf2conv.py left.bin \
            --base 0x26000 --family 0xADA52840 \
            --output ${{ matrix.central_output_name || format('{0}_left.uf2', matrix.output_name) }}

          arm-none-eabi-objcopy -O binary \
            target/thumbv7em-none-eabihf/release/peripheral right.bin
          python3 ../../uf2conv.py right.bin \
            --base 0x26000 --family 0xADA52840 \
            --output ${{ matrix.peripheral_output_name || format('{0}_right.uf2', matrix.output_name) }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            keyboards/${{ matrix.keyboard }}/${{ matrix.central_output_name || format('{0}_left.uf2', matrix.output_name) }}
            keyboards/${{ matrix.keyboard }}/${{ matrix.peripheral_output_name || format('{0}_right.uf2', matrix.output_name) }}
          retention-days: 30

  build-qube:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    name: Build ${{ matrix.output_name }} firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: classic_qube
            output_name: op36_qube
            keyboard_toml: keyboard.toml
            vial_json: vial.json
          - keyboard: classic_qube
            output_name: k03_qube
            keyboard_toml: keyboard_k03.toml
            vial_json: vial_k03.json
          - keyboard: classic_qube
            output_name: velvet_qube
            keyboard_toml: keyboard_velvet.toml
            vial_json: vial_velvet.json
          - keyboard: classic_qube
            output_name: imperial44_qube
            keyboard_toml: keyboard_imperial44.toml
            vial_json: vial_imperial44.json
          - keyboard: k04
            output_name: k04_qube_k04
            keyboard_toml: keyboard_qube.toml
            vial_json: vial_qube.json
            half_no_default: "--no-default-features"
            half_features: "--features qube-half"
          - keyboard: k04
            output_name: k04_qube_mini
            keyboard_toml: keyboard_qube_mini.toml
            vial_json: vial_qube_mini.json
            half_no_default: "--no-default-features"
            half_features: "--features qube-half"
          - keyboard: k04
            output_name: k04_qube_micro
            keyboard_toml: keyboard_qube_micro.toml
            vial_json: vial_qube_micro.json
            half_no_default: "--no-default-features"
            half_features: "--features qube-half"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi clang libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.keyboard }}-${{ hashFiles('keyboards/${{ matrix.keyboard }}/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.keyboard }}-
            ${{ runner.os }}-cargo-

      - name: Install flip-link
        run: cargo install flip-link --locked

      - name: Download uf2conv script
        run: |
          for i in 1 2 3 4 5; do
            curl -fL --retry 3 --retry-delay 5 \
              https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py \
              -o uf2conv.py && break || sleep 10
          done
          for i in 1 2 3; do
            curl -fL --retry 3 --retry-delay 5 \
              https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json \
              -o uf2families.json && break || sleep 10
          done
          python3 -c "import ast; ast.parse(open('uf2conv.py').read())" || { echo "uf2conv.py invalid"; exit 1; }
          chmod +x uf2conv.py

      - name: Build Qube dongle
        working-directory: keyboards/${{ matrix.keyboard }}
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/lib/arm-none-eabi --target=arm-none-eabi -I/usr/lib/arm-none-eabi/include -I/usr/lib/gcc/arm-none-eabi/13.2.1/include"
          CARGO_TARGET_DIR: target/${{ matrix.output_name }}/qube
          KEYBOARD_TOML_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.keyboard_toml }}
          RUST_MIN_STACK: "33554432"
          VIAL_JSON_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.vial_json }}
        run: cargo build --release --bin qube --no-default-features --features qube

      - name: Build left half
        working-directory: keyboards/${{ matrix.keyboard }}
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/lib/arm-none-eabi --target=arm-none-eabi -I/usr/lib/arm-none-eabi/include -I/usr/lib/gcc/arm-none-eabi/13.2.1/include"
          CARGO_TARGET_DIR: target/${{ matrix.output_name }}/halves
          KEYBOARD_TOML_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.keyboard_toml }}
          RUST_MIN_STACK: "33554432"
          VIAL_JSON_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.vial_json }}
        run: cargo build --release --bin left ${{ matrix.half_no_default }} ${{ matrix.half_features }}

      - name: Build right half
        working-directory: keyboards/${{ matrix.keyboard }}
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/lib/arm-none-eabi --target=arm-none-eabi -I/usr/lib/arm-none-eabi/include -I/usr/lib/gcc/arm-none-eabi/13.2.1/include"
          CARGO_TARGET_DIR: target/${{ matrix.output_name }}/halves
          KEYBOARD_TOML_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.keyboard_toml }}
          RUST_MIN_STACK: "33554432"
          VIAL_JSON_PATH: ${{ github.workspace }}/keyboards/${{ matrix.keyboard }}/${{ matrix.vial_json }}
        run: cargo build --release --bin right ${{ matrix.half_no_default }} ${{ matrix.half_features }}

      - name: Convert to UF2
        working-directory: keyboards/${{ matrix.keyboard }}
        run: |
          arm-none-eabi-objcopy -O binary \
            target/${{ matrix.output_name }}/qube/thumbv7em-none-eabihf/release/qube qube.bin
          python3 ../../uf2conv.py qube.bin \
            --base 0x1000 --family 0xADA52840 \
            --output ${{ matrix.output_name }}_dongle.uf2

          arm-none-eabi-objcopy -O binary \
            target/${{ matrix.output_name }}/halves/thumbv7em-none-eabihf/release/left left.bin
          python3 ../../uf2conv.py left.bin \
            --base 0x26000 --family 0xADA52840 \
            --output ${{ matrix.output_name }}_left.uf2

          arm-none-eabi-objcopy -O binary \
            target/${{ matrix.output_name }}/halves/thumbv7em-none-eabihf/release/right right.bin
          python3 ../../uf2conv.py right.bin \
            --base 0x26000 --family 0xADA52840 \
            --output ${{ matrix.output_name }}_right.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            keyboards/${{ matrix.keyboard }}/${{ matrix.output_name }}_dongle.uf2
            keyboards/${{ matrix.keyboard }}/${{ matrix.output_name }}_left.uf2
            keyboards/${{ matrix.keyboard }}/${{ matrix.output_name }}_right.uf2
          retention-days: 30

  build-settings-reset:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    name: Build storage utility firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-storage-utilities-${{ hashFiles('tools/settings_reset/Cargo.lock', 'tools/storage_migrate/Cargo.lock') }}

      - name: Download uf2conv script
        run: |
          curl -fL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -o $GITHUB_WORKSPACE/uf2conv.py
          curl -fL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json -o $GITHUB_WORKSPACE/uf2families.json

      - name: Test Storage Migration preflight
        working-directory: tools/storage_migrate
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --locked --lib --target "$host_target"

      - name: Build Settings Reset for halves
        working-directory: tools/settings_reset
        env:
          CARGO_TARGET_DIR: target/halves
        run: cargo build --release --locked

      - name: Build Settings Reset for Qube
        working-directory: tools/settings_reset
        env:
          CARGO_TARGET_DIR: target/qube
        run: cargo build --release --locked --features qube

      - name: Build Storage Migration for halves
        working-directory: tools/storage_migrate
        env:
          CARGO_TARGET_DIR: target/halves
        run: cargo build --release --locked

      - name: Build Storage Migration for Qube
        working-directory: tools/storage_migrate
        env:
          CARGO_TARGET_DIR: target/qube
        run: cargo build --release --locked --features qube

      - name: Convert reset utilities to UF2
        working-directory: tools/settings_reset
        run: |
          arm-none-eabi-objcopy -O binary \
            target/halves/thumbv7em-none-eabihf/release/settings-reset settings_reset.bin
          python3 $GITHUB_WORKSPACE/uf2conv.py settings_reset.bin \
            --base 0x26000 --family 0xADA52840 \
            --output settings_reset.uf2

          arm-none-eabi-objcopy -O binary \
            target/qube/thumbv7em-none-eabihf/release/settings-reset settings_reset_qube.bin
          python3 $GITHUB_WORKSPACE/uf2conv.py settings_reset_qube.bin \
            --base 0x1000 --family 0xADA52840 \
            --output settings_reset_qube.uf2

      - name: Convert migration utilities to UF2
        working-directory: tools/storage_migrate
        run: |
          arm-none-eabi-objcopy -O binary \
            target/halves/thumbv7em-none-eabihf/release/storage-migrate storage_migrate.bin
          python3 $GITHUB_WORKSPACE/uf2conv.py storage_migrate.bin \
            --base 0x26000 --family 0xADA52840 \
            --output storage_migrate.uf2

          arm-none-eabi-objcopy -O binary \
            target/qube/thumbv7em-none-eabihf/release/storage-migrate storage_migrate_qube.bin
          python3 $GITHUB_WORKSPACE/uf2conv.py storage_migrate_qube.bin \
            --base 0x1000 --family 0xADA52840 \
            --output storage_migrate_qube.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: storage_utilities
          path: |
            tools/settings_reset/settings_reset.uf2
            tools/settings_reset/settings_reset_qube.uf2
            tools/storage_migrate/storage_migrate.uf2
            tools/storage_migrate/storage_migrate_qube.uf2
          retention-days: 30

  complete:
    name: Complete firmware coverage
    if: ${{ always() }}
    needs: [plan, validate-profile, build, build-qube, build-settings-reset]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: verify
        name: Verify the complete owning graph
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/workflow_complete.py firmware
      - name: Record full firmware proof
        if: steps.verify.outputs.full == 'true'
        run: python3 .github/scripts/ci_policy.py record --profile firmware --output "$RUNNER_TEMP/ci-proof/firmware.json"
      - name: Upload full firmware proof
        if: steps.verify.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-proof-firmware-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof/firmware.json
          if-no-files-found: error
