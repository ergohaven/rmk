name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "upstream-merge"]
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.policy.outputs.run }}
      reason: ${{ steps.policy.outputs.reason }}
      source_run: ${{ steps.policy.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s .github/scripts -p test_ci_policy.py
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_workflow_*.py'
      - id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_policy.py plan --profile tests

  format:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: .github/ci/format.sh

  # Verify every Cargo.lock is in sync with its Cargo.toml. Catches the
  # case where a deps bump in rmk/rmk-types is merged without refreshing
  # example lockfiles (see scripts/fetch_all.sh).
  fetch-check:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/fetch_all.sh --check

  check:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools
          targets: thumbv6m-none-eabi,thumbv7m-none-eabi,thumbv7em-none-eabi,thumbv7em-none-eabihf,thumbv8m.main-none-eabihf,riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check
          # check.sh redirects cargo artifacts to target/ci/ via --target-dir
          # (so cargo-batch can share compilation across manifests). Tell
          # rust-cache about it, otherwise it only caches the per-crate
          # target/ dirs which stay empty.
          cache-directories: |
            target/ci
      - name: Install cargo-batch
        run: cargo install --locked --git https://github.com/embassy-rs/cargo-batch cargo --bin cargo-batch
      - run: .github/ci/check.sh

  test:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools
          targets: thumbv6m-none-eabi,thumbv7m-none-eabi,thumbv7em-none-eabi,thumbv7em-none-eabihf,thumbv8m.main-none-eabihf,riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          # test.sh writes to target/ci/test via CARGO_TARGET_DIR; cache it
          # explicitly so rust-cache doesn't miss it.
          cache-directories: |
            target/ci
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9
      - name: Install cargo-expand
        run: cargo install --locked cargo-expand
      - run: .github/ci/test.sh

  # Discover buildable examples for the matrix
  host:
    name: Build the Rynk host crate
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Install host system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
          fallback: none
      # host.sh pins the npx TypeScript version; there is no Node project here.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/ci/host.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-host
          workspaces: rynk -> ../target/ci/host
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: .github/ci/host.sh

  qemu-rynk:
    name: Verify Rynk behavior in QEMU
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-qemu-rynk
          workspaces: |
            examples/use_rust/qemu-riscv-rynk
            rynk
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-misc libdbus-1-dev pkg-config
          qemu-system-riscv32 --version
      - name: Run QEMU Rynk behavior verifier
        working-directory: examples/use_rust/qemu-riscv-rynk
        run: python3 run.py

  discover:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.discover.outputs.stable }}
      esp: ${{ steps.discover.outputs.esp }}
    steps:
      - uses: actions/checkout@v6
      - id: discover
        run: .github/ci/discover.sh

  # Build discovered groups through the shared upstream example runner.
  build:
    name: build (${{ matrix.name }})
    needs: [plan, discover]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include: ${{ fromJson(needs.discover.outputs.stable) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        if: matrix.cache
        with:
          shared-key: ci-examples-shared-v2-${{ matrix.name }}
          workspaces: ${{ matrix.workspaces }}
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install target and tools
        run: |
          rustup target add ${{ matrix.target }}
          cargo install flip-link 2>/dev/null || true
      - name: Install ARM build dependencies
        if: matrix.arm_gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-dev clang libclang-dev llvm-dev
          libclang_dir=$(/usr/bin/llvm-config --libdir)
          echo "CLANG_PATH=/usr/bin/clang" >> "$GITHUB_ENV"
          printf 'LIBCLANG_PATH=%s\n' "$libclang_dir" >> "$GITHUB_ENV"
          test -e "$libclang_dir/libclang.so"
      - name: Prepare size comparison
        if: github.event_name == 'pull_request' && matrix.bloat
        run: |
          rustup component add llvm-tools
          echo "BASE_SHA=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"
          id=$(docker create ghcr.io/carlosperate/bloaty-action:latest)
          sudo docker cp "$id:/usr/local/bin/bloaty" /usr/local/bin/bloaty
          docker rm "$id" >/dev/null
      - name: Build and compare examples
        env:
          EXAMPLES: ${{ toJson(matrix.examples) }}
          TARGET: ${{ matrix.target }}
          COMPARE_BASE: ${{ github.event_name == 'pull_request' && matrix.bloat }}
        run: .github/ci/build-examples.sh
      - name: Upload bloat data
        if: github.event_name == 'pull_request' && matrix.bloat
        uses: actions/upload-artifact@v7
        with:
          name: bloat-${{ matrix.name }}
          path: bloat-data/
          retention-days: 1

  # Assemble bloat report from matrix artifacts and save for the comment workflow
  bloat-report:
    if: needs.plan.outputs.run == 'true' && github.event_name == 'pull_request'
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: bloat-artifacts
          pattern: bloat-*
          merge-multiple: true
      - name: Generate report
        run: |
          report=$(.github/ci/bloat-report.sh bloat-artifacts)
          mkdir -p bloat-comment
          echo "${{ github.event.pull_request.number }}" > bloat-comment/pr-number.txt
          echo "$report" > bloat-comment/report.md
      - name: Upload comment data
        uses: actions/upload-artifact@v7
        with:
          name: bloat-comment
          path: bloat-comment/
          retention-days: 1

  # Build ESP/xtensa examples (separate toolchain)
  build-esp:
    needs: [plan, discover]
    if: needs.plan.outputs.run == 'true' && fromJson(needs.discover.outputs.esp)[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-esp
          # Both esp examples share one target dir (target-esp/, set in the
          # build step); point rust-cache at it so per-dep artifacts survive.
          workspaces: |
            examples/use_config/esp32s3_ble -> ../../../target-esp
            examples/use_rust/esp32s3_ble -> ../../../target-esp
      - name: Install espup and esp toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall --force espup -y
          espup install
      - name: Build ESP examples
        run: |
          source "$HOME/export-esp.sh"
          export CARGO_TARGET_DIR="$PWD/target-esp"
          for dir in examples/use_rust/esp32s3_ble examples/use_config/esp32s3_ble; do
            (cd "$dir" && CARGO_UNSTABLE_BUILD_STD=alloc,core cargo +esp build --release)
          done

  complete:
    name: Complete test coverage
    if: ${{ always() }}
    needs: [plan, format, fetch-check, check, test, host, qemu-rynk, discover, build, build-esp, bloat-report]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: verify
        name: Verify the complete owning graph
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/workflow_complete.py tests
      - name: Record full test proof
        if: steps.verify.outputs.full == 'true'
        run: python3 .github/scripts/ci_policy.py record --profile tests --output "$RUNNER_TEMP/ci-proof/tests.json"
      - name: Upload full test proof
        if: steps.verify.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-proof-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof/tests.json
          if-no-files-found: error
