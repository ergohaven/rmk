[keyboard]
name = "Ergohaven OP36"
product_name = "OP36"
vendor_id = 0xE126
product_id = 0x0036
manufacturer = "Ergohaven"
chip = "nrf52840"

[host]
# Rynk with Ergohaven's commands; Vial is off.
vial_enabled = false
rynk_enabled = true
# Writes need no unlock, as over Vial.
write_requires_unlock = false
unlock_keys = [[1, 2], [1, 1]]

[event]
action.channel_size = 16
action.subs = 1
keyboard.subs = 4

[layout]
rows = 6
cols = 6
# op36: 3 rows x 5+5 cols = 30 + 3+3 thumb = 36 total
# Left: rows 0-2 (cols 0-4 main, col5 = thumb)
# Right: rows 3-5 (cols 0-4 main, col5 = thumb)
map = """
(0,4,L) (0,3,L) (0,2,L) (0,1,L) (0,0,L)    (3,0,R) (3,1,R) (3,2,R) (3,3,R) (3,4,R)
(1,4,L) (1,3,L) (1,2,L) (1,1,L) (1,0,L)    (4,0,R) (4,1,R) (4,2,R) (4,3,R) (4,4,R)
(2,4,L) (2,3,L) (2,2,L) (2,1,L) (2,0,L)    (5,0,R) (5,1,R) (5,2,R) (5,3,R) (5,4,R)
            (0,5,*) (1,5,*) (2,5,*)    (5,5,*) (4,5,*) (3,5,*)
"""

# Common factory layers mirror K:04 Micro. Its two unused inner bottom-row
# positions and its hardware-specific pointing/encoder actions are omitted.

[keymap]
layers = 16
no_action_layer_start = 5

[[keymap.layer]]
name = "Base"
keys = """
Q           W           E            R           T     Y     U           I            O           P
MT(A,LGui)  MT(S,LAlt)  MT(D,LShift) MT(F,LCtrl) G     H     MT(J,RCtrl) MT(K,RShift) MT(L,RAlt) MT(Semicolon,RGui)
Z           X           C            V           B     N     M           Comma        Dot         Quote
                        Backspace    MO(1)         Space Enter MO(2)       Tab
"""

[[keymap.layer]]
name = "Nav"
keys = """
Kc1            Kc2             Kc3               Kc4           Kc5          Kc6      Kc7          Kc8             Kc9         Kc0
MT(Home,LGui)  MT(Insert,LAlt)  MT(Delete,LShift) MT(End,LCtrl) Enter        Escape   MT(Left,RCtrl) MT(Down,RShift) MT(Up,RAlt) MT(Right,RGui)
PageDown       PageUp          _                 _             PrintScreen  _        _            _               CapsLock    CapsWordToggle
                              _                 _             _            _        MO(3)        _
"""

[[keymap.layer]]
name = "Symbols"
keys = """
SHIFTED(Kc2)       SHIFTED(Comma)          Equal                   SHIFTED(Dot)            Grave          SHIFTED(Kc6)  SHIFTED(Quote)                    SHIFTED(Minus)            Quote                  _
MT(Backslash,LGui) MT(WM(Kc9,LShift),LAlt) MT(Minus,LShift)        MT(WM(Kc0,LShift),LCtrl) SHIFTED(Equal) SHIFTED(Kc5)  MT(WM(LeftBracket,LShift),RCtrl) MT(Semicolon,RShift)      MT(WM(RightBracket,LShift),RAlt) MT(WM(Kc1,LShift),RGui)
SHIFTED(Kc3)       SHIFTED(Kc8)            SHIFTED(Semicolon)      Slash                   _              _            SHIFTED(Backslash)               SHIFTED(Grave)            SHIFTED(Kc7)            SHIFTED(Kc4)
                                           _                       MO(3)                   _              _            _                                _
"""

[[keymap.layer]]
name = "Adjust"
keys = """
Bootloader  F1             F2              F3              F4   User0            User1                   User2                  User3                 User4
LGui        F5             F6              F7              F8   User37           AudioVolDown            AudioMute             AudioVolUp          User7
_           F9             F10             F11             F12  User38           MediaPrevTrack          MediaPlayPause        MediaNextTrack         No
                                        _  _               _    _                _                       _
"""

[ble]
enabled = true
default_tx_power = 8
use_2m_phy = false

[split]
connection = "ble"

[split.central]
rows = 3
cols = 6
row_offset = 0
col_offset = 0

[split.central.matrix]
row_pins = ["P1_09", "P0_05", "P0_09"]
col_pins = ["P0_13", "P0_24", "P0_10", "P0_03", "P1_10", "P1_11"]

[[split.peripheral]]
rows = 3
cols = 6
row_offset = 3
col_offset = 0

[split.peripheral.matrix]
row_pins = ["P1_09", "P0_05", "P1_10"]
col_pins = ["P0_30", "P0_29", "P0_02", "P1_13", "P0_28", "P0_03"]

[rmk]
split_peripherals_num = 1
split_pairing_timeout_seconds = 30
ble_reconnect_timeout_seconds = 60
ble_pairing_timeout_seconds = 60
split_central_sleep_timeout_seconds = 120
combo_max_num = 32
combo_max_length = 4
fork_max_num = 32
morse_max_num = 32
max_patterns_per_key = 8
# Rynk's encoding takes up to twice Vial's bytes, and a frame holds the whole pool.
macro_space_size = 4096
rynk_buffer_size = 4128
ble_profiles_num = 5

[storage]
start_addr = 0xCC000
num_sectors = 32
clear_storage = false
