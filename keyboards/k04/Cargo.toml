[package]
name = "k04"
version = "0.1.0"
description = "Shared RMK BLE firmware for Ergohaven K:04 Series, standalone and Qube (nRF52840)"
homepage = "https://github.com/ergohaven/rmk"
repository = "https://github.com/ergohaven/rmk"
readme = "README.md"
edition = "2021"
license = "MIT OR Apache-2.0"
autotests = false
autobenches = false
autoexamples = false

[features]
default = ["standalone"]
standalone = ["rmk/defmt"]
usb_debug = ["rmk/usb_log"]
usb_debug_force_ble = ["usb_debug"]
# Qube dongle ST7789 UI (only for --bin qube).
qube = [
    "rmk/usb_log",
    "rmk/st7789",
    "dep:lcd-async",
    "dep:embedded-hal-bus",
    "dep:embedded-graphics",
    "dep:rmk-types",
    "dep:u8g2-fonts",
]
# Preserve the former Qube-half build feature set without enabling USB logging
# in standalone K:04 firmware.
qube-half = ["rmk/usb_log"]

[dependencies]
rmk = { path = "../../rmk", default-features = false, features = [
    "storage",
    "vial",
    "vial_lock",
    "universal_symbols",
    "ble_zero_latency",
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
    "display",
] }
embedded-hal-bus = { version = "0.3", features = ["async"], optional = true }
embedded-graphics = { version = "0.8", optional = true }
lcd-async = { version = "0.1", optional = true }
rmk-types = { path = "../../rmk-types", optional = true }
u8g2-fonts = { version = "0.5.2", features = ["embedded_graphics_textstyle"], optional = true }
heapless = "0.9"
embassy-futures = "0.1"
embassy-sync = "0.8"
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.9", default-features = false, features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6" }
rand_chacha = { version = "0.3", default-features = false }
embassy-usb-driver = "=0.2.2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"


[[bin]]
name = "central"
path = "src/central.rs"
test = false
bench = false

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"
test = false
bench = false

[[bin]]
name = "qube"
path = "src/qube.rs"
required-features = ["qube"]
test = false
bench = false

[[bin]]
name = "left"
path = "src/left.rs"
required-features = ["qube-half"]
test = false
bench = false

[[bin]]
name = "right"
path = "src/right.rs"
required-features = ["qube-half"]
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"

# Prevent cargo from looking for a workspace above this directory
[workspace]
members = ["."]

[[bin]]
name = "hardreset"
path = "src/bin/hardreset.rs"
test = false
bench = false
