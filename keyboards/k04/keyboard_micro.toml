# K:04 Series — Micro profile.
[keyboard]
name = "Ergohaven K:04 Micro"
product_name = "K:04 Micro"
vendor_id = 0xE126
product_id = 0x0076
manufacturer = "Ergohaven"
chip = "nrf52840"

[host]
# Rynk with Ergohaven's commands; Vial is off.
vial_enabled = false
rynk_enabled = true
# Writes need no unlock, as over Vial.
write_requires_unlock = false
# Unlock keys: hold simultaneously to unlock the configurator
unlock_keys = [[1, 2], [1, 1]]

[event]
action.channel_size = 16
action.subs = 2
keyboard.subs = 4
peripheral_battery.pubs = 2
peripheral_battery.subs = 4
# One settings update publishes base, BT profile, and encoder packets together.
peripheral_settings.channel_size = 3
# ModuleSettingsBroadcast answers the re-sync request raised on peripheral link-up.
peripheral_settings_refresh.subs = 1
layer_change.channel_size = 4
layer_change.subs = 6
modifier.channel_size = 8
modifier.subs = 6
sleep_state.subs = 4

[layout]
rows = 8
cols = 6
# map: maps physical (row,col) positions to logical matrix positions
# Left half rows 0-3, Right half rows 4-7.
# K04 Micro follows Phenom Micro with the keys under X/C and comma/dot removed.
map = """
(0,4,L) (0,3,L) (0,2,L) (0,1,L) (0,0,L)                    (4,0,R) (4,1,R) (4,2,R) (4,3,R) (4,4,R)
(1,4,L) (1,3,L) (1,2,L) (1,1,L) (1,0,L)                    (5,0,R) (5,1,R) (5,2,R) (5,3,R) (5,4,R)
(2,4,L) (2,3,L) (2,2,L) (2,1,L) (2,0,L) (3,0,*)    (7,0,*) (6,0,R) (6,1,R) (6,2,R) (6,3,R) (6,4,R)
                  (3,3,*) (3,2,*) (3,1,*)    (7,1,*) (7,2,*) (7,3,*)
"""

[keymap]
layers = 16
no_action_layer_start = 5

[[keymap.layer]]
name = "Base"
# Phenom Micro layout with the keys under X/C and comma/dot removed.
keys = """
Q           W           E            R           T     Y     U           I            O           P
MT(A,LGui)  MT(S,LAlt)  MT(D,LShift) MT(F,LCtrl) G     H     MT(J,RCtrl) MT(K,RShift) MT(L,RAlt) MT(Semicolon,RGui)
Z           X           C            V           B     _     _           N            M           Comma  Dot  Quote
                  Backspace MO(1) Space Enter MO(2) Tab
"""
# encoders: [central_A1/B1, peripheral_A1/B1]
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[keymap.layer]]
name = "Nav"
# Phenom Micro lower layer, trimmed to the K04 Micro physical layout.
keys = """
Kc1            Kc2             Kc3               Kc4           Kc5          Kc6      Kc7          Kc8             Kc9         Kc0
MT(Home,LGui)  MT(Insert,LAlt)  MT(Delete,LShift) MT(End,LCtrl) Enter        Escape   MT(Left,RCtrl) MT(Down,RShift) MT(Up,RAlt) MT(Right,RGui)
PageDown       PageUp          _                 _             PrintScreen  _        _            _               _           _        CapsLock CapsWordToggle
                  _            _            _            _        MO(3) _
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[keymap.layer]]
name = "Symbols"
# Phenom Micro raise layer. All shifted chars use SHIFTED().
keys = """
SHIFTED(Kc2)       SHIFTED(Comma)     Equal            SHIFTED(Dot)        Grave          SHIFTED(Kc6)  SHIFTED(Quote)           SHIFTED(Minus)       Quote                 _
MT(Backslash,LGui) MT(WM(Kc9,LShift),LAlt) MT(Minus,LShift) MT(WM(Kc0,LShift),LCtrl) SHIFTED(Equal) SHIFTED(Kc5)  MT(WM(LeftBracket,LShift),RCtrl) MT(Semicolon,RShift) MT(WM(RightBracket,LShift),RAlt) MT(WM(Kc1,LShift),RGui)
SHIFTED(Kc3)       SHIFTED(Kc8)       SHIFTED(Semicolon) Slash            _              _            _                        _                   SHIFTED(Backslash)  SHIFTED(Grave) SHIFTED(Kc7) SHIFTED(Kc4)
                  _              MO(3)           _                  _              _                    _
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[keymap.layer]]
name = "Adjust"
# Reference layout: function keys on the left, BT/media controls on the right.
keys = """
Bootloader  F1             F2              F3              F4   User19  User20                User21              User22            User23
LGui        F5             F6              F7              F8   User37  AudioVolDown           AudioMute             AudioVolUp          User26
_           F9             F10             F11             F12  _       _                     User38              MediaPrevTrack    MediaPlayPause  MediaNextTrack User39
                  _   _    _    _      _      _
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[keymap.layer]]
name = "Pointing"
# Phenom Micro pointing layer, trimmed to the K04 Micro physical layout.
keys = """
_      _          _          _          _      _      _          _          _          _
User29  MouseBtn3  MouseBtn2  MouseBtn1  User28  User28  MouseBtn1  MouseBtn2  MouseBtn3  User29
_      _          _          _          User30  _      _          User30     _          _      _  _
                  _          _          _       _      _          _
"""
encoders = [["MouseWheelDown","MouseWheelUp"],["MouseWheelDown","MouseWheelUp"]]

[ble]
enabled = true
default_tx_power = 8
use_2m_phy = false

[chip.nrf52840]
# K:04 Series uses the same E73-2G4M08S1C power path across profiles.
dcdc_reg0 = false
dcdc_reg1 = true
dcdc_reg0_voltage = "3V3"

[split]
connection = "ble"

[split.central]
rows = 4
cols = 6
row_offset = 0
col_offset = 0
# ble_addr removed — RMK manages addresses from storage automatically

[split.central.matrix]
matrix_type = "normal"
# K04 schematic, with R1/top row omitted.
# R2..R5 = P0.28, P0.03, P1.10, P1.11
# C1..C6 = P1.06, P1.04, P1.02, P1.00, P0.22, P0.20
row_pins = ["P0_28", "P0_03", "P1_10", "P1_11"]
col_pins = ["P1_06", "P1_04", "P1_02", "P1_00", "P0_22", "P0_20"]

[[split.central.input_device.encoder]]
# v0.0.18: swap A/B to fix encoder direction.
pin_a = "P0_10"
pin_b = "P0_09"
phase = "resolution"
resolution = 4
internal_pullup = true

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 4
col_offset = 0
# ble_addr removed — RMK manages addresses from storage automatically

[split.peripheral.matrix]
matrix_type = "normal"
# K04 schematic, with R1/top row omitted.
# R2..R5 = P0.28, P0.03, P1.10, P1.11
# C1..C6 = P1.06, P1.04, P1.02, P1.00, P0.22, P0.20
row_pins = ["P0_28", "P0_03", "P1_10", "P1_11"]
col_pins = ["P1_06", "P1_04", "P1_02", "P1_00", "P0_22", "P0_20"]

[[split.peripheral.input_device.encoder]]
# v0.0.18: swap A/B to fix encoder direction.
pin_a = "P0_10"
pin_b = "P0_09"
phase = "resolution"
resolution = 4
internal_pullup = true

[rmk]
split_peripherals_num = 1
split_pairing_timeout_seconds = 30
ble_reconnect_timeout_seconds = 60
ble_pairing_timeout_seconds = 60
split_central_sleep_timeout_seconds = 120
combo_max_num = 32
fork_max_num = 32
morse_max_num = 32
# Rynk's encoding takes up to twice Vial's bytes, and a frame holds the whole pool.
macro_space_size = 4096
rynk_buffer_size = 4128
ble_profiles_num = 5

[storage]
# Keep the 128 KiB RMK settings area outside the linked application image.
# 0xEC000..0xF4000 remains reserved by the board/bootloader layout.
start_addr = 0xCC000
num_sectors = 32
clear_storage = false
# Preserve the Vial/Entropy keymap. Use settings_reset once when changing
# between K:04 Series profiles.
clear_layout = false
