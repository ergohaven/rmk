[keyboard]
name = "Ergohaven K:04 Mini (Qube)"
product_name = "K:04 Mini (Qube)"
vendor_id = 0xE126
product_id = 0x0072
manufacturer = "Ergohaven"
chip = "nrf52840"

[host]
vial_enabled = false
rynk_enabled = true
# Writes need no unlock, as over Vial.
write_requires_unlock = false
unlock_keys = [[1, 2], [1, 1]]

[rmk]
split_peripherals_num = 2
split_pairing_timeout_seconds = 30
ble_reconnect_timeout_seconds = 60
ble_pairing_timeout_seconds = 60
split_central_sleep_timeout_seconds = 300
combo_max_num = 32
fork_max_num = 32
morse_max_num = 32
# Rynk's encoding takes up to twice Vial's bytes, and a frame holds the whole pool.
macro_space_size = 4096
rynk_buffer_size = 4128
ble_profiles_num = 5

[ble]
enabled = true
# The controller's 7.5 ms default puts every other event of the 7.5 ms
# trackball link on the 15 ms link of the other half. Two 3 ms events
# spaced 3.75 ms apart fit with 0.75 ms to spare on each side.
central_event_length_us = 3000
central_acl_event_spacing_us = 3750
# The Qube reaches the PC over USB only; host advertising would take radio
# time from the half links.
host_advertising = false

[storage]
# Keep the 128 KiB RMK settings area outside the linked application image.
# 0xEC000..0xF4000 remains reserved by the board/bootloader layout.
start_addr = 0xCC000
num_sectors = 32
clear_storage = false
clear_layout = false

[event]
action.channel_size = 16
action.subs = 2
keyboard.subs = 4
peripheral_battery.pubs = 2
peripheral_battery.subs = 4
# ModuleSettingsBroadcast answers the re-sync request raised on peripheral link-up.
peripheral_settings_refresh.subs = 1
layer_change.channel_size = 4
layer_change.subs = 6
modifier.channel_size = 8
modifier.subs = 6
sleep_state.subs = 4

[split]
connection = "ble"

[split.central]
rows = 0
cols = 0
row_offset = 0
col_offset = 0

[split.central.matrix]
matrix_type = "direct_pin"
direct_pins = []

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_28", "P0_03", "P1_10", "P1_11"]
col_pins = ["P1_06", "P1_04", "P1_02", "P1_00", "P0_22", "P0_20"]

[[split.peripheral.input_device.encoder]]
pin_a = "P0_10"
pin_b = "P0_09"
phase = "resolution"
resolution = 4
internal_pullup = true

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 4
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_28", "P0_03", "P1_10", "P1_11"]
col_pins = ["P1_06", "P1_04", "P1_02", "P1_00", "P0_22", "P0_20"]

[[split.peripheral.input_device.encoder]]
pin_a = "P0_10"
pin_b = "P0_09"
phase = "resolution"
resolution = 4
internal_pullup = true

[layout]
rows = 8
cols = 6
map = """
(0,5,L) (0,4,L) (0,3,L) (0,2,L) (0,1,L) (0,0,L)                    (4,0,R) (4,1,R) (4,2,R) (4,3,R) (4,4,R) (4,5,R)
(1,5,L) (1,4,L) (1,3,L) (1,2,L) (1,1,L) (1,0,L)                    (5,0,R) (5,1,R) (5,2,R) (5,3,R) (5,4,R) (5,5,R)
(2,5,L) (2,4,L) (2,3,L) (2,2,L) (2,1,L) (2,0,L) (3,0,*)    (7,0,*) (6,0,R) (6,1,R) (6,2,R) (6,3,R) (6,4,R) (6,5,R)
                  (3,5,*) (3,4,*) (3,3,*) (3,2,*) (3,1,*)    (7,1,*) (7,2,*) (7,3,*) (7,4,*) (7,5,*)
"""

[keymap]
layers = 16
no_action_layer_start = 5

[[keymap.layer]]
name = "Base"
keys = """
Escape  Q     W     E     R     T     Y     U     I     O     P     Backspace
Tab     A     S     D     F     G     H     J     K     L     Semicolon  Backslash
LShift  Z     X     C     V     B     _     _     N     M     Comma  Dot  Quote  RShift
Grave   LGui  LCtrl MO(1) Space Enter MO(2) LAlt  LeftBracket RightBracket
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[keymap.layer]]
name = "Nav"
keys = """
_      Kc1      Kc2     Kc3     Kc4     Kc5          Kc6  Kc7  Kc8  Kc9  Kc0    _
_      Home     Insert  Delete  End     Enter        _    Left Down Up   Right  _
_      _        _       _       _       PrintScreen  _    _    _    _    _      _      _  _
PageDown PageUp _       _       _       _            MO(3)    _     CapsLock CapsWordToggle
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[keymap.layer]]
name = "Symbols"
keys = """
_  SHIFTED(Kc2)   SHIFTED(Comma) Equal           SHIFTED(Dot)       Grave          SHIFTED(Kc6)    SHIFTED(Quote)       SHIFTED(Minus)      Quote         _              _
_  Backslash      SHIFTED(Kc9)   Minus           SHIFTED(Kc0)       SHIFTED(Equal) SHIFTED(Kc5)    SHIFTED(LeftBracket) Semicolon           SHIFTED(RightBracket) SHIFTED(Kc1) _
_  SHIFTED(Kc3)   SHIFTED(Kc8)   SHIFTED(Semicolon) Slash           _              _              _                    _                   SHIFTED(Backslash) SHIFTED(Grave) SHIFTED(Kc7) SHIFTED(Kc4) _
_  _              _              MO(3)           _                  _              _              _                    _                   _
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[keymap.layer]]
name = "Adjust"
keys = """
Bootloader  _               F1  F2   F3   F4   User19 User20 User21 User22 User23 User26
_           _               F5  F6   F7   F8   User37 AudioVolDown AudioMute AudioVolUp _      _
_           _               F9  F10  F11  F12  _      _      User38 MediaPrevTrack MediaPlayPause MediaNextTrack _ User39
_           _               _   _    _    _    _      _      _      _
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[keymap.layer]]
name = "Pointing"
keys = """
_  _      _          _          _          _      _      _          _          _          _      _
_  User29  MouseBtn3  MouseBtn2  MouseBtn1  User28  User28  MouseBtn1  MouseBtn2  MouseBtn3  User29  _
_  _      _          _          _          User30  _      _          User30     _          _      _  _  _
_  _      _          _          _          _       _      _          _          _
"""
encoders = [["MouseWheelDown","MouseWheelUp"],["MouseWheelDown","MouseWheelUp"]]
