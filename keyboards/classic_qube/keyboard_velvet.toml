[keyboard]
name = "Ergohaven Velvet"
product_name = "Velvet"
vendor_id = 0xE126
product_id = 0x00BE
manufacturer = "Ergohaven"
chip = "nrf52840"

[host]
# Rynk with Ergohaven's commands; Vial is off.
vial_enabled = false
rynk_enabled = true
# Writes need no unlock, as over Vial.
write_requires_unlock = false
unlock_keys = [[1, 3], [1, 4]]

[rmk]
split_peripherals_num = 2
split_pairing_timeout_seconds = 30
ble_reconnect_timeout_seconds = 60
ble_pairing_timeout_seconds = 60
split_central_sleep_timeout_seconds = 900
combo_max_num = 32
combo_max_length = 4
fork_max_num = 32
morse_max_num = 32
max_patterns_per_key = 8
# Rynk's encoding takes up to twice Vial's bytes, and a frame holds the whole pool.
macro_space_size = 4096
rynk_buffer_size = 4128
ble_profiles_num = 5

[ble]
enabled = true

[storage]
start_addr = 0xCC000
num_sectors = 32
clear_storage = false

[event]
action.channel_size = 16
action.subs = 2
keyboard.subs = 4
peripheral_battery.pubs = 2
peripheral_battery.subs = 4
layer_change.channel_size = 4
layer_change.subs = 6
modifier.channel_size = 8
modifier.subs = 6
# VelvetSettingsBroadcast owns the persistent pointing snapshot and listens for
# a refresh whenever the right half reconnects. This event is opt-in in RMK.
peripheral_settings_refresh.subs = 1

[split]
connection = "ble"

[split.central]
rows = 0
cols = 0
row_offset = 0
col_offset = 0

[split.central.matrix]
matrix_type = "direct_pin"
direct_pins = []

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_30", "P0_10", "P0_09", "P0_24"]
col_pins = ["P0_02", "P1_13", "P0_28", "P0_03", "P1_10", "P1_11"]

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 4
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P1_13", "P0_02", "P0_29", "P0_30"]
col_pins = ["P0_24", "P0_09", "P0_10", "P1_11", "P1_10", "P0_03"]

# Optional PMW3610 on the right half. The same firmware also supports the
# key-only Velvet because these pins are independent from the key matrix.
[[split.peripheral.input_device.pmw3610]]
name = "trackball0"
spi.instance = "bitbang0"
spi.sck = "P0_08"
spi.mosi = "P0_17"
spi.miso = "P0_17"
spi.cs = "P0_13"
motion = "P0_15"
cpi = 1000
# Keep the same proven PMW3610 tracking path as Velvet Standalone.
smart_mode = true
report_hz = 125
swap_xy = true
invert_x = true
invert_y = true

# The generic RMK runner owns activation and its exact deadline. Velvet
# settings update this entry at runtime (enabled modes, layer and timeout).
[[behavior.auto_mouse_layer]]
device_id = 0
target_layer = 4
timeout = "500ms"
threshold = 2

[layout]
rows = 8
cols = 6
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,L)                    (4,0,R) (4,1,R) (4,2,R) (4,3,R) (4,4,R) (4,5,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L)                    (5,0,R) (5,1,R) (5,2,R) (5,3,R) (5,4,R) (5,5,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L)                    (6,0,R) (6,1,R) (6,2,R) (6,3,R) (6,4,R) (6,5,R)
      (3,2,*) (3,3,*) (3,4,*) (3,5,*) (3,1,*)    (7,4,*) (7,0,*) (7,1,*) (7,2,*) (7,3,*)
"""

[keymap]
layers = 16
no_action_layer_start = 5

[[keymap.layer]]
name = "Base"
# Common factory layers mirror K:04 Mini. Velvet omits its two unused inner
# bottom-row positions; hardware-specific pointing and encoder actions are not copied.
keys = """
Escape  Q     W     E     R     T     Y     U     I     O     P     Backspace
Tab     A     S     D     F     G     H     J     K     L     Semicolon  Backslash
LShift  Z     X     C     V     B     N     M     Comma  Dot  Quote  RShift
        Grave LGui  LCtrl MO(1) Space Enter MO(2) LAlt  LeftBracket  RightBracket
"""

[[keymap.layer]]
name = "Nav"
keys = """
_      Kc1      Kc2     Kc3     Kc4     Kc5          Kc6  Kc7  Kc8  Kc9  Kc0    _
_      Home     Insert  Delete  End      Enter         _    Left Down Up   Right  _
_      _        _       _       _        PrintScreen   _    _    _    _    _      _
PageDown PageUp _       _       _        _             MO(3) _    CapsLock CapsWordToggle
"""

[[keymap.layer]]
name = "Symbols"
keys = """
_  SHIFTED(Kc2)  SHIFTED(Comma) Equal                SHIFTED(Dot)       Grave           SHIFTED(Kc6) SHIFTED(Quote)       SHIFTED(Minus)      Quote           _              _
_  Backslash     SHIFTED(Kc9)   Minus                SHIFTED(Kc0)       SHIFTED(Equal)  SHIFTED(Kc5) SHIFTED(LeftBracket) Semicolon           SHIFTED(RightBracket) SHIFTED(Kc1) _
_  SHIFTED(Kc3)  SHIFTED(Kc8)   SHIFTED(Semicolon)  Slash              _               _            SHIFTED(Backslash) SHIFTED(Grave) SHIFTED(Kc7) SHIFTED(Kc4) _
_  _             _              MO(3)                _                  _               _            _                    _                   _
"""

[[keymap.layer]]
name = "Adjust"
keys = """
Bootloader  _  F1  F2  F3  F4  User0  User1  User2  User3  User4  User7
_   _  F5  F6  F7  F8  User37  AudioVolDown  AudioMute  AudioVolUp  _  _
_   _  F9  F10  F11  F12  User38  MediaPrevTrack  MediaPlayPause  MediaNextTrack  _  No
        _  _  _  _  _  _  _  _  _  _
"""

[[keymap.layer]]
name = "Mouse"
keys = """
_  _      _          _          _          _       _       _          _          _          _       _
_  User11 MouseBtn3  MouseBtn2  MouseBtn1  User10  User10  MouseBtn1  MouseBtn2  MouseBtn3  User11  _
_  _      _          _          _          User12  User12  _          _          _          _       _
        _  _  _  _  _  _  _  _  _  _
"""
